name: Distrikt Beta
version: "1.12.0-beta.15"
slug: distrikt_beta
init: false
description: "Lokalt overblik over distriktskort, udleveringer, gennemgange og print"
url: https://github.com/Bib007/LTM-Local-Territory-Manager
arch:
  - amd64
  - aarch64
startup: application
boot: manual
timeout: 180
backup_exclude:
  - "*"
ingress: false
host_network: false
hassio_api: false
