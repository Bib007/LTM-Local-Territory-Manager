<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LTM · profilprøve</title><link rel="stylesheet" href="/profile-preview.css"><script src="/profile-preview.js" defer></script><body><main><header><h1>LTM · brugere</h1><span id="online"></span></header><p class="notice">Udviklingsprøve · endnu ikke en del af den almindelige app.</p><p id="message" role="status"></p><form id="login"><h2>Log ind</h2><label>Brugernavn<input name="name" autocomplete="username" required maxlength="100"></label><label>Adgangskode<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button>Log ind</button></form><section id="workspace" hidden><div class="bar"><h2 id="greeting"></h2><button id="logout">Log ud</button></div><section><h2>Ændringer til gennemgang</h2><p>Læs de forskellige rettelser, før du markerer dem gennemgået.</p><div id="conflicts"></div></section><section id="admin" hidden><h2>Brugere og roller</h2><form id="role"><h3>Opret eller ret en rolle</h3><label>Rolle<select name="id"><option value="">Ny rolle</option></select></label><label>Navn<input name="name" required maxlength="100"></label><fieldset id="permissions"><legend>Rettigheder</legend></fieldset><button>Gem rolle</button></form><form id="user"><h3>Opret eller ret en bruger</h3><label>Bruger<select name="id"><option value="">Ny bruger</option></select></label><label>Navn<input name="name" required maxlength="100"></label><fieldset id="roles"><legend>Roller</legend></fieldset><label>Ny adgangskode (tom ved uændret)<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024"></label><label><input name="disabled" type="checkbox"> Deaktiveret</label><button>Gem bruger</button></form></section></section></main></body></html>
