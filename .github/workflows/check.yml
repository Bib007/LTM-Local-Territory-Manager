name: Checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fictional package privacy and reproducibility checks
        run: python scripts/test_build_release.py
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - name: Isolated synthetic-data tests
        run: python -m unittest discover -s distrikt/tests -v
      - name: Build program-only archive
        run: python scripts/build_release.py
  javascript:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Copenhagen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node distrikt/tests/test_frontend.cjs
      - name: Syntax check
        run: find distrikt/app -maxdepth 1 -name '*.js' -exec node --check {} \;
