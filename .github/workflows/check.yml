name: Checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fictional package privacy and reproducibility checks
        run: python scripts/test_build_release.py
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - name: Isolated synthetic-data tests
        run: python -m unittest discover -s distrikt/tests -v
      - name: Build program-only archive
        run: python scripts/build_release.py
  javascript:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Copenhagen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node distrikt/tests/test_frontend.cjs
      - run: node distrikt/tests/test_address_source_ui.cjs
      - run: node distrikt/tests/test_welcome.cjs
      - run: node distrikt/tests/test_onboarding.cjs
      - run: node distrikt/tests/test_i18n.cjs
      - run: node distrikt/tests/test_desk_language.cjs
      - run: node distrikt/tests/test_publisher_search.cjs
      - run: node distrikt/tests/test_digital_card.cjs
      - run: node distrikt/tests/test_work_lists_language.cjs
      - run: node distrikt/tests/test_dashboard_controls.cjs
      - run: node distrikt/tests/test_card_workflow_language.cjs
      - run: node distrikt/tests/test_settings_language.cjs
      - run: node distrikt/tests/test_report_language.cjs
      - run: node distrikt/tests/test_map_overview_language.cjs
      - run: node distrikt/tests/test_address_workflow_language.cjs
      - run: node distrikt/tests/test_geo_workflow_language.cjs
      - run: node distrikt/tests/test_setup_workflow_language.cjs
      - run: node distrikt/tests/test_share_workflow_language.cjs
      - run: node distrikt/tests/test_request_safety.cjs
      - run: node distrikt/tests/test_confirmation_safety.cjs
      - run: node distrikt/tests/test_transfer_safety.cjs
      - name: Install isolated browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/ltm-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/ltm-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Offline geographic editor browser workflows
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_geo_browser.cjs
      - name: Syntax check
        run: find distrikt/app -maxdepth 1 -name '*.js' -exec node --check {} \;
