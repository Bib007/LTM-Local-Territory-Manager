name: Checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require synchronized Danish/English changelogs
        run: python scripts/check_changelog.py
      - name: Shared Beta/Stable version policy regression tests
        run: python -m unittest discover -s scripts -p test_version_policy.py -v
      - name: Fictional package privacy and reproducibility checks
        run: python scripts/test_build_release.py
      - name: Real archive startup and checksums
        run: python scripts/check_release_smoke.py
      - name: Isolated HA beta package contracts
        run: python -m unittest discover -s scripts -p test_build_beta.py -v
      - name: Separate release-track package contracts
        run: python -m unittest discover -s scripts -p test_build_tracks.py -v
  ha-status-blueprint:
    uses: ./.github/workflows/ha-status.yml
  geo-cache-97-benchmark:
    # Only this isolated PR. Baseline and candidate use their real Store code
    # in independent processes on the SAME runner, never a user installation.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/geo-cache-field-invalidation-97-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare unmodified develop baseline to candidate on fictional SQLite
        run: |
          git worktree add --detach "$RUNNER_TEMP/ltm97-baseline" d6bc3102148e6e51d0450a855b3b80bab1b5fe70
          python scripts/benchmark_geo_cache_97.py --app-dir "$RUNNER_TEMP/ltm97-baseline/distrikt/app" --addresses 50000 --cards 180 --history 12000 --roads 2000 --buildings 6500 --runs 7 > "$RUNNER_TEMP/ltm97-before.json"
          python scripts/benchmark_geo_cache_97.py --addresses 50000 --cards 180 --history 12000 --roads 2000 --buildings 6500 --runs 7 > "$RUNNER_TEMP/ltm97-after.json"
          python - "$RUNNER_TEMP/ltm97-before.json" "$RUNNER_TEMP/ltm97-after.json" <<'PY'
          import json,sys
          before,after=(json.load(open(p,encoding='utf8')) for p in sys.argv[1:])
          for older,newer in zip(before['cases'],after['cases']):
              assert older['scenario']==newer['scenario']
              name=older['scenario']
              print('Case:',name,flush=True)
              print('  Before medians ms:',older['median_ms'],flush=True)
              print('  After  medians ms:',newer['median_ms'],flush=True)
              print('  Cache before/after:',older['geo_cache_reused'],newer['geo_cache_reused'],flush=True)
              if name in ('card_color','loan_finish'):
                  assert not any(older['geo_cache_reused'])
                  assert all(newer['geo_cache_reused'])
                  assert all(x==0 for x in newer['geo_generation_deltas'])
              else:
                  assert not any(older['geo_cache_reused']+newer['geo_cache_reused'])
                  assert all(x==1 for x in newer['geo_generation_deltas'])
              assert older['payload']['geo_address_count']==50000
              assert newer['payload']['geo_address_count']==50000
          PY
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - name: Isolated synthetic-data tests
        run: python -m unittest discover -s distrikt/tests -v
      - name: Build program-only archive
        run: python scripts/build_release.py
  javascript:
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Copenhagen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install isolated browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/ltm-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/ltm-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          node "$RUNNER_TEMP/ltm-browser/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Navigation during delayed saves and uncertain receipts
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_save_navigation_browser.cjs
      - name: All synthetic JavaScript contracts
        run: for testfile in distrikt/tests/test_*.cjs; do node "$testfile" || exit 1; done
      - name: Fictional demo and shared product design
        run: |
          python scripts/sync_demo_design.py --check
          python scripts/test_build_demo.py
          node demo/test_model.cjs
          node demo/test_ui.cjs
          python scripts/build_demo.py
      - name: Light appearance and preserved local drafts
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_THEME=light node scripts/check_desk_browser.cjs
      - name: Light touch appearance in WebKit
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_THEME=light LTM_TOUCH=1 LTM_BROWSER_ENGINE=webkit node scripts/check_desk_browser.cjs
      - name: Fictional product-layout demo browser workflows
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_demo_browser.cjs
      - name: Offline geographic editor browser workflows
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_geo_browser.cjs
      - name: Responsive S-13 and synthetic mobile OSM failures (Chromium / WebKit)
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_BROWSER_OUTPUT="$RUNNER_TEMP/ltm-visual" node scripts/check_report_mobile_browser.cjs
      - name: Reversible standalone print previews in Chromium and WebKit
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_standalone_print_browser.cjs
      - name: Original-size IB cards, pagination and A4/cut PDF checks
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_ib_print_browser.cjs
      - name: Unified setup and required tour browser workflows
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_onboarding_browser.cjs
      - name: Publisher merge with preserved history
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_publisher_merge_browser.cjs
      - name: Offline daily use and publisher returns
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_desk_browser.cjs
      - name: Touch phone and tablet daily workflows in Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_TOUCH=1 LTM_BROWSER_OUTPUT="$RUNNER_TEMP/ltm-visual" node scripts/check_desk_browser.cjs
      - name: Touch phone and tablet daily workflows in WebKit
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_TOUCH=1 LTM_BROWSER_ENGINE=webkit LTM_BROWSER_OUTPUT="$RUNNER_TEMP/ltm-visual" node scripts/check_desk_browser.cjs
      - name: Real server image import and security policy
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_photo_browser.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_BROWSER_ENGINE=webkit node scripts/check_photo_browser.cjs
      - name: Real application profiles and concurrent saves
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_profiles_app_browser.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_BROWSER_ENGINE=webkit node scripts/check_profiles_app_browser.cjs
      - name: Exact assignment deletion and recovery from History
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_loan_deletion_browser.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_BROWSER_ENGINE=webkit node scripts/check_loan_deletion_browser.cjs
      - name: Task responsibility with fictional local accounts
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_task_ownership_browser.cjs
      - name: Read-only manual split planning
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_split_suggestions_browser.cjs
      - name: Reviewed DAR street suggestions and imprecise IB dates
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_street_suggestions_browser.cjs
      - name: Dense interval fronts and preserved original footer
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_front_intervals_browser.cjs
      - name: English and Danish originals in real print windows
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_english_forms_browser.cjs
      - name: Period-specific real A4 report PDFs with fictional data
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_report_period_pdf_browser.cjs
      - name: Offline login and keyboard workflows
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" node scripts/check_access_browser.cjs
      - name: Fictional header and digital map visual checks
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_BROWSER_OUTPUT="$RUNNER_TEMP/ltm-visual" node scripts/check_visual_browser.cjs
      - name: HA scheduled address task browser workflows
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ltm-browser/node_modules/playwright" LTM_BROWSER_OUTPUT="$RUNNER_TEMP/ltm-visual" node scripts/check_address_task_browser.cjs
      - name: Fictional visual review images
        id: fictional-visual-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fictional-visual-checks
          path: ${{ runner.temp }}/ltm-visual
          if-no-files-found: ignore
          retention-days: 7
      - name: Report optional visual artifact upload failure
        if: ${{ always() && steps.fictional-visual-artifact.outcome == 'failure' }}
        run: echo "::warning::Visual screenshots could not be uploaded to GitHub artifacts. The independent visual browser assertions still determine pass/fail; review the upload log and retry if screenshots are needed."
      - name: Syntax check
        run: find distrikt/app -maxdepth 1 -name '*.js' -exec node --check {} \;
