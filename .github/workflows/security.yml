name: Security checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated review tools
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Audit explicit bundled Python versions
        run: python -m pip_audit -r scripts/security-dependencies.txt --no-deps --disable-pip
      - name: Block high severity static Python findings
        run: python -m bandit -r distrikt/app -x distrikt/app/vendor_py --severity-level high
