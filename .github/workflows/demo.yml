name: Demo checks and Pages
on:
  pull_request:
    paths: ['demo/**', 'scripts/build_demo.py', '.github/workflows/demo.yml']
  push:
    branches: [main]
    paths: ['demo/**', 'scripts/build_demo.py', '.github/workflows/demo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node demo/test_model.cjs
      - run: node demo/test_ui.cjs
      - run: node --check demo/demo.js
      - run: python scripts/build_demo.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          path: dist/demo
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy fictional browser demo
        id: deployment
        uses: actions/deploy-pages@v4
